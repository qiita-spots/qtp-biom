# name: Qiita Plugin CI

on:
  push:
    branches: [ dev ]
  pull_request:

jobs:
  # derived from https://github.com/actions/example-services/blob/master/.github/workflows/postgres-service.yml
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub image
        image: postgres:13.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          COVER_PACKAGE: ${{ matrix.cover_package }}

        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # based on https://github.com/actions/example-services/blob/master/.github/workflows/postgres-service.yml#L44-L72
          - 5432/tcp

    steps:
      # Downloads a copy of the code in your repository before running CI tests
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Setup for conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.6

      # we need to download qiita directly so we have "easy" access to
      # all config files
      - name: Checkout qiita dev codebase
        uses: actions/checkout@v4
        with:
          repository: qiita-spots/qiita
          ref: dev
          path: qiita-dev

      - name: Basic dependencies install
        env:
          COVER_PACKAGE: ${{ matrix.cover_package }}
        shell: bash -l {0}
        run: |
          echo "Testing: " $COVER_PACKAGE

          # pull out the port so we can modify the configuration file easily
          pgport=${{ job.services.postgres.ports[5432] }}
          sed -i "s/PORT = 5432/PORT = $pgport/" qiita-dev/qiita_core/support_files/config_test.cfg

          # PGPASSWORD is read by pg_restore, which is called by the build_db process.
          export PGPASSWORD=postgres

          # Setting up main qiita conda environment
          conda config --add channels conda-forge
          conda create -q --yes -n qiita python=3.9 libgfortran numpy nginx cython redis
          conda activate qiita

      - name: Qiita install
        shell: bash -l {0}
        run: |
          conda activate qiita
          pip install qiita-dev/ --no-binary redbiom
          mkdir ~/.qiita_plugins

      - name: Install Qiita plugins
        shell: bash -l {0}
        run: |
          QIIME2RELEASE=2022.8
          wget https://data.qiime2.org/distro/core/qiime2-${QIIME2RELEASE}-py38-linux-conda.yml
          sed -n '/channels/,/dependencies/p' qiime2-${QIIME2RELEASE}-py38-linux-conda.yml > tinyq2.yml
          echo "  - q2-metadata=${QIIME2RELEASE}" >> tinyq2.yml
          echo "  - q2-mystery-stew=${QIIME2RELEASE}" >> tinyq2.yml
          echo "  - q2-types=${QIIME2RELEASE}" >> tinyq2.yml
          echo "  - q2cli=${QIIME2RELEASE}" >> tinyq2.yml
          echo "  - q2templates=${QIIME2RELEASE}" >> tinyq2.yml
          echo "  - qiime2=${QIIME2RELEASE}" >> tinyq2.yml
          echo "  - q2-feature-table=${QIIME2RELEASE}" >> tinyq2.yml
          
          conda config --set channel_priority strict
          # ensure conda NOT to chose CUDA packages, which are not available on github runners
          CONDA_OVERRIDE_CUDA="0" conda env create --quiet -n qtp-biom --file tinyq2.yml
          rm qiime2-${QIIME2RELEASE}-py38-linux-conda.yml tinyq2.yml

          conda activate qtp-biom

          # patch pandas to downgrade behaviour to 0.25.*
          sed -i "s/pd.option_context('display.max_colwidth', -1)/pd.option_context('display.max_colwidth', None)/" ${CONDA_PREFIX}/lib/python3.8/site-packages/q2templates/util.py

          export QIITA_ROOTCA_CERT=`pwd`/qiita-dev/qiita_core/support_files/ci_rootca.crt
          export QIITA_CONFIG_FP=`pwd`/qiita-dev/qiita_core/support_files/config_test_local.cfg
          pip --quiet install -U pip
          pip --quiet install Cython
          pip --quiet install iow
          pip --quiet install .
          pip --quiet install coveralls

          configure_biom --env-script "source /home/runner/.profile; conda activate qtp-biom" --server-cert $QIITA_ROOTCA_CERT

          echo "Available Qiita plugins"
          ls ~/.qiita_plugins/

      - name: Starting Main Services
        shell: bash -l {0}
        run: |
          conda activate qiita
          export QIITA_ROOTCA_CERT=`pwd`/qiita-dev/qiita_core/support_files/ci_rootca.crt
          export QIITA_CONFIG_FP=`pwd`/qiita-dev/qiita_core/support_files/config_test_local.cfg
          sed "s#/home/runner/work/qiita/qiita#${PWD}/qiita-dev/#g" `pwd`/qiita-dev/qiita_core/support_files/config_test.cfg > ${QIITA_CONFIG_FP}

          export REDBIOM_HOST="http://localhost:7379"

          echo "1. Setting up redis"
          redis-server --daemonize yes --port 7777

          echo "2. Setting up nginx"
          mkdir -p ${CONDA_PREFIX}/var/run/nginx/
          export NGINX_FILE=`pwd`/qiita-dev/qiita_pet/nginx_example.conf
          export NGINX_FILE_NEW=`pwd`/qiita-dev/qiita_pet/nginx_example_local.conf
          sed "s#/home/runner/work/qiita/qiita#${PWD}/qiita-dev/#g" ${NGINX_FILE} > ${NGINX_FILE_NEW}
          nginx -c ${NGINX_FILE_NEW}

          echo "3. Setting up qiita"
          qiita-env make --no-load-ontologies
          qiita plugins update
          qiita-test-install

          echo "4. Starting supervisord => multiple qiita instances"
          supervisord -c ${PWD}/qiita-dev/qiita_pet/supervisor_example.conf
          sleep 10
          cat /tmp/supervisord.log

      # NEU: Detaillierte Statusprüfung nach dem Start
      - name: Check Qiita Service Status
        shell: bash -l {0}
        # always() stellt sicher, dass dieser Step auch bei Fehlern ausgeführt wird
        if: always()
        run: |
          conda activate qiita

          echo "=== Supervisord Status ==="
          supervisorctl -c ${PWD}/qiita-dev/qiita_pet/supervisor_example.conf status || true

          echo ""
          echo "=== Supervisord Log ==="
          cat /tmp/supervisord.log || true

          echo ""
          echo "=== Qiita Tornadoserver Logs ==="
          # Alle Log-Dateien ausgeben, die supervisord für die Qiita-Instanzen anlegt
          for logfile in /tmp/qiita_*.log; do
            if [ -f "$logfile" ]; then
              echo "--- $logfile ---"
              cat "$logfile" || true
            fi
          done

          echo ""
          echo "=== Nginx Status ==="
          nginx -tCONDA_PREFIX}/var/log/nginx/error.log 2>/dev/null || \
          echo "Kein Nginx Error Log gefunden"

          echo ""
          echo "=== Redis Status ==="
          redis-cli -p 7777 ping || echo "Redis antwortet nicht!"
          echo "Redis Info:"
          redis-cli -p 7777 info server 2>/dev/null || true

          echo ""
          echo "=== Postgres Status ==="
          export PGPASSWORD=postgres
          pgport=${{ job.services.postgres.ports[5432] }}
          pg_isready -h localhost -p $pgport -U postgres && \
            echo "Postgres läuft auf Port $pgport" || \
            echo "Postgres antwortet nicht auf Port $pgport!"

          echo ""
          echo "=== Netzwerk: Offene Ports ==="
          ss -tlnp | grep -E '21174|8383|7777|5432' || \
          netstat -tlnp 2>/dev/null | grep -E '21174|8383|7777|5432' || \
          echo "Keine relevanten Ports gefunden"

          echo ""
          echo "=== HTTP Erreichbarkeit von Qiita ==="
          curl -sk --max-time 10 https://localhost:21174 -o /dev/null \
            -w "HTTP Status: %{http_code}\nConnect Time: %{time_connect}s\nTotal Time: %{time_total}s\n" \
            || echo "Qiita HTTPS nicht erreichbar!"

          echo ""
          echo "=== Registrierte Qiita Plugins ==="
          ls -la ~/.qiita_plugins/ || echo "Keine Plugins gefunden"

          echo ""
          echo "=== Python Prozesse ==="
          ps aux | grep -E 'python|qiita|tornado|nginx|redis|postgres' | grep -v grep || true

          echo ""
          echo "=== Disk Usage ==="
          df -h

          echo ""
          echo "=== Memory Usage ==="
          free -h

      - name: Main tests
        shell: bash -l {0}
        env:
          COVER_PACKAGE: ${{ matrix.cover_package }}
        run: |
          conda activate qtp-biom
          export QIITA_ROOTCA_CERT=`pwd`/qiita-dev/qiita_core/support_files/ci_rootca.crt
          export QIITA_CONFIG_FP=`pwd`/qiita-dev/qiita_core/support_files/config_test_local.cfg

          export PYTHONWARNINGS="ignore:Certificate for localhost has no \`subjectAltName\`"

          nosetests --with-doctest --with-coverage --cover-package=qtp_biom

      - uses: codecov/codecov-action@v1
        with:
         token: ${{ secrets.CODECOV_TOKEN }}
         file: codecov.yml

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: flake8
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: install dependencies
      run: python -m pip install --upgrade pip
    - name: Check out repository code
      uses: actions/checkout@v2
    - name: lint
      run: |
        pip install -q flake8
        flake8 qtp_biom setup.py scripts
